name: Rotate profile animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["*.svg", ".github/workflows/rotate.yml"]

permissions:
  contents: write

concurrency:
  group: rotate
  cancel-in-progress: true

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick today's animation
        run: |
          scenes=(donut trefoil penrose lorenz)
          day=$((10#$(date -u +%j)))
          pick=${scenes[$((day % ${#scenes[@]}))]}
          echo "Today's animation: $pick"
          mkdir dist
          cp "$pick.svg" dist/current.svg
          echo "PICK=$pick" >> "$GITHUB_ENV"

      - name: Publish to output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.svg
          git commit -q -m "Show $PICK"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
